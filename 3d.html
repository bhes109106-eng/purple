<!DOCTYPE html>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- GSAP for Smooth Camera & UI Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- Google Fonts: Traditional Chinese Calligraphy & Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            palace: {
              red: '#8F1D1D',
              deepred: '#5C0F0F',
              gold: '#D4AF37',
              brightgold: '#FFD700',
              jade: '#1C3A27',
              darkjade: '#0F2317',
              silk: '#F8F4E9',
              darkbg: '#0D0F17',
            }
          },
          fontFamily: {
            calli: ['"Ma Shan Zheng"', 'cursive', 'serif'],
            serif: ['"Noto Serif TC"', 'serif'],

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background-color: #0d0f17;
      user-select: none;
      -webkit-user-select: none;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphism Panels */
    .glass-panel {
      background: rgba(22, 18, 24, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
    }

    .glass-panel-gold {
      background: linear-gradient(135deg, rgba(143, 29, 29, 0.88), rgba(92, 15, 15, 0.94));
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 215, 0, 0.5);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(18, 18, 22, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #D4AF37;
      border-radius: 3px;
    }

    /* Glowing Animations */
    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4), inset 0 0 5px rgba(212, 175, 55, 0.2); }
      50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), inset 0 0 12px rgba(255, 215, 0, 0.4); }
    }
    .glow-gold {
      animation: goldGlow 3s infinite;
    }

    /* POI HTML Markers */
    .poi-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      transition: opacity 0.3s ease, transform 0.2s ease;
      cursor: pointer;
      z-index: 10;
    }
    .poi-marker:hover {
      transform: translate(-50%, -115%) scale(1.12);
    }

    .vignette-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
      z-index: 2;
    }
  </style>
</head>

    function setupLighting() {
      lights.ambient = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(lights.ambient);

      lights.sun = new THREE.DirectionalLight(0xfffaed, 1.2);
      lights.sun.position.set(40, 60, 30);
      lights.sun.castShadow = true;
      lights.sun.shadow.mapSize.width = 2048;
      lights.sun.shadow.mapSize.height = 2048;
      lights.sun.shadow.camera.near = 0.5;
      lights.sun.shadow.camera.far = 200;
      const d = 60;
      lights.sun.shadow.camera.left = -d;
      lights.sun.shadow.camera.right = d;
      lights.sun.shadow.camera.top = d;
      lights.sun.shadow.camera.bottom = -d;
      lights.sun.shadow.bias = -0.0005;
      scene.add(lights.sun);

      lights.hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3);
      scene.add(lights.hemi);

      gsap.to(scene.background, { r: bgTarget.r, g: bgTarget.g, b: bgTarget.b, duration });
      gsap.to(scene.fog.color, { r: bgTarget.r, g: bgTarget.g, b: bgTarget.b, duration });

      if (isDay) {
        gsap.to(lights.ambient, { intensity: 0.75, duration });
        gsap.to(lights.sun, { intensity: 1.2, duration });
        gsap.to(lights.sun.position, { x: 40, y: 60, z: 30, duration });
      } else {
        gsap.to(lights.ambient, { intensity: 0.2, duration });
        gsap.to(lights.sun, { intensity: 0.2, duration });
        gsap.to(lights.sun.position, { x: -20, y: 40, z: -30, duration });
      }

      document.getElementById('icon-daynight').className = isDay ? 'fa-solid fa-sun text-base' : 'fa-solid fa-moon text-base text-amber-300';
    }

    function createPlaqueMesh(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0F2A4A';
      ctx.fillRect(0, 0, 256, 96);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#D4AF37';
      ctx.strokeRect(4, 4, 248, 88);

      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 42px "Noto Serif TC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 48);

      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(
        new THREE.PlaneGeometry(1.8, 0.68),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true })
      );
    }

    /* =========================================================================
       7. ATMOSPHERIC WEATHER PARTICLES (落花 / 飛雪)
       ========================================================================= */
    function createParticleSystem() {
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 160;
        positions[i + 1] = Math.random() * 50;
        positions[i + 2] = (Math.random() - 0.5) * 160;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0xFFB7C5, // Cherry Blossom Pink
        size: 0.6,
        transparent: true,
        opacity: 0.8
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);
    }

    function animateParticles(delta) {
      if (!particleSystem) return;
      const positions = particleSystem.geometry.attributes.position.array;

      for (let i = 1; i < positions.length; i += 3) {
        positions[i] -= delta * 4; // Fall downwards
        if (positions[i] < 0) positions[i] = 50; // Reset height
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    function create3DMarkers() {
      const container = document.getElementById('markers-container');
      container.innerHTML = '';

      POI_DATABASE.forEach(poi => {
        const div = document.createElement('div');
        div.className = 'poi-marker pointer-events-auto flex flex-col items-center group';
        div.dataset.id = poi.id;

        div.innerHTML = `
          <div class="px-2.5 py-1 rounded-full glass-panel border border-palace-gold/60 text-palace-brightgold text-xs font-bold shadow-2xl flex items-center gap-1.5 backdrop-blur-md group-hover:bg-palace-red group-hover:text-white transition-all duration-300">
            <span class="w-2 h-2 rounded-full ${isVisited ? 'bg-emerald-400' : 'bg-amber-400 animate-ping'}"></span>
            <span>${poi.name}</span>
          </div>
          <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-palace-gold -mt-[1px]"></div>
        `;

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          selectPOI(poi);
        });

        container.appendChild(div);
        markerElements.push({ element: div, coords: poi.coords, poi });
      });
    }

    function update3DMarkers() {
      if (state.viewMode === 'interior') {
        markerElements.forEach(item => item.element.style.opacity = '0');
        return;
      }

      const tempVec = new THREE.Vector3();
      markerElements.forEach(item => {
        tempVec.set(item.coords.x, item.coords.y + 7.5, item.coords.z);
        tempVec.project(camera);

        if (tempVec.z > 1) {
          item.element.style.opacity = '0';
          item.element.style.pointerEvents = 'none';
          return;
        }

        const x = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;

        item.element.style.left = `${x}px`;
        item.element.style.top = `${y}px`;
        item.element.style.opacity = '1';
        item.element.style.pointerEvents = 'auto';
      });
    }

    /* =========================================================================
       9. ANIMATED WALKING NPC (EMPEROR)
       ========================================================================= */
    const npcWaypoints = [
      { x: 0, z: 22 },
      { x: 0, z: 2 },
      { x: -28, z: -10 },
      { x: 0, z: -32 },
      { x: 28, z: -25 }
    ];
    let currentWaypointIdx = 0, npcAnimTime = 0;

    function createWalkingNPC() {
      npcGroup = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.6, 1.8, 12),
        new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.4 })
      );
      body.position.y = 0.9;
      npcGroup.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xFFDBAC })
      );
      head.position.y = 2.0;
      npcGroup.add(head);

      const hat = new THREE.Mesh(
        new THREE.ConeGeometry(0.5, 0.4, 12),
        new THREE.MeshStandardMaterial({ color: 0x8F1D1D })
      );
      hat.position.y = 2.35;
      npcGroup.add(hat);

      npcGroup.position.set(npcWaypoints[0].x, 0, npcWaypoints[0].z);
      scene.add(npcGroup);
    }

    function animateNPC(delta) {
      if (!npcGroup || state.viewMode === 'interior') return;

      const target = npcWaypoints[currentWaypointIdx];
      const pos = npcGroup.position;
      const dx = target.x - pos.x;
      const dz = target.z - pos.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      if (dist < 0.5) {
        currentWaypointIdx = (currentWaypointIdx + 1) % npcWaypoints.length;
      } else {
        const speed = 3.5 * delta;
        pos.x += (dx / dist) * speed;
        pos.z += (dz / dist) * speed;

        npcGroup.rotation.y = Math.atan2(dx, dz);
        npcAnimTime += delta * 8;
        npcGroup.position.y = Math.abs(Math.sin(npcAnimTime)) * 0.15;
      }
    }

    function resetCamera() {
      state.viewMode = 'exterior';
      document.getElementById('interior-back-banner').classList.add('hidden');

      gsap.to(camera.position, {
        x: 0,
        y: 38,
        z: 65,

      });

      gsap.to(controls.target, {

        z: 0,
        duration: 1.8,
        ease: 'power2.inOut',

      });

    function onPointerDown(event) {
      if (event.target.tagName !== 'CANVAS') return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children, true);
      for (let i = 0; i < intersects.length; i++) {
        let obj = intersects[i].object;
        while (obj.parent && obj.parent !== scene) {
          if (obj.userData && obj.userData.isCharacter) {
            openCharacterDialogue(obj.userData.poi);
            return;
          }
          if (obj.userData && obj.userData.id) {
            selectPOI(obj.userData);
            return;
          }
          obj = obj.parent;
        }
      }
    }

    /* =========================================================================
       11. CHARACTER DIALOGUE & FAVORABILITY SYSTEM
       ========================================================================= */
    function openCharacterDialogue(poi) {
      if (!poi) poi = state.currentPOI || POI_DATABASE[2];

      const modal = document.getElementById('character-dialogue-modal');
      document.getElementById('dialogue-avatar').innerText = poi.avatar || '👸';
      document.getElementById('dialogue-char-name').innerText = poi.character;
      document.getElementById('dialogue-speech-text').innerText = poi.quote;

      const favorScore = state.favorability[poi.id] || 20;
      updateFavorabilityUI(poi.id, favorScore);

      const optionsContainer = document.getElementById('dialogue-options-container');
      const choices = poi.dialogues || [
        { text: '「向主子請安，願主子吉星高照。」', favor: 10, reply: '「算你懂事，本宮重重有賞。」' }
      ];

      optionsContainer.innerHTML = choices.map((c, idx) => `
        <button onclick="handleDialogueChoice('${poi.id}', ${idx})" class="w-full text-left p-3 rounded-xl glass-panel hover:bg-palace-gold/30 border border-palace-gold/40 text-amber-100 text-xs font-bold transition flex items-center justify-between group">
          <span>${c.text}</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition text-palace-brightgold"></i>
        </button>
      `).join('');

      modal.classList.remove('hidden');
    }

    function handleDialogueChoice(poiId, choiceIdx) {
      const poi = POI_DATABASE.find(p => p.id === poiId);
      if (!poi || !poi.dialogues) return;

      const choice = poi.dialogues[choiceIdx];
      let currentFavor = state.favorability[poiId] || 20;
      currentFavor += choice.favor;
      state.favorability[poiId] = Math.max(0, Math.min(100, currentFavor));
      localStorage.setItem('zh_favorability', JSON.stringify(state.favorability));

      updateFavorabilityUI(poiId, state.favorability[poiId]);

      // Typewriter Effect for NPC Reply
      const speechText = document.getElementById('dialogue-speech-text');
      speechText.innerText = '';
      let charIdx = 0;
      const textToType = choice.reply;

      const timer = setInterval(() => {
        if (charIdx < textToType.length) {
          speechText.innerText += textToType.charAt(charIdx);
          charIdx++;
        } else {
          clearInterval(timer);
        }
      }, 40);

      playChimeSFX();
    }

    function updateFavorabilityUI(poiId, score) {
      let title = '萍水相逢';
      if (score >= 80) title = '莫逆之交';
      else if (score >= 50) title = '心腹知己';
      else if (score >= 30) title = '漸入佳境';

      document.getElementById('dialogue-favor-score').innerText = `❤️ 好感度: ${score}`;
      document.getElementById('dialogue-favor-title').innerText = title;

      document.getElementById('panel-favor-score').innerText = `好感度: ${score}`;
      document.getElementById('panel-favor-title').innerText = title;
    }

      if (isSaved) {

    function toggleBookmarkCurrentPOI() {
      if (!state.currentPOI) return;
      const id = state.currentPOI.id;
      const idx = state.saved.indexOf(id);

      if (idx > -1) {
        state.saved.splice(idx, 1);
      } else {
        state.saved.push(id);
      }

      localStorage.setItem('zh_saved_spots', JSON.stringify(state.saved));
      updatePanelBookmarkBtn(id);
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmark-count-badge');
      badge.innerText = state.saved.length;
      if (state.saved.length > 0) badge.classList.remove('hidden');
      else badge.classList.add('hidden');
    }

    function updateProgressUI() {
      const count = state.visited.length;
      const total = POI_DATABASE.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('progress-text').innerText = `${count} / ${total}`;
      document.getElementById('progress-bar-fill').style.width = `${pct}%`;
    }

    /* =========================================================================
       13. SEARCH & BOOKMARKS
       ========================================================================= */
    function setupSearch() {
      const input = document.getElementById('search-input');
      const dropdown = document.getElementById('search-dropdown');
      const clearBtn = document.getElementById('clear-search');

      input.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
          dropdown.classList.add('hidden');
          clearBtn.classList.add('hidden');
          return;
        }

        clearBtn.classList.remove('hidden');
        const matches = POI_DATABASE.filter(p => 
          p.name.toLowerCase().includes(query) ||
          p.character.toLowerCase().includes(query) ||
          p.region.toLowerCase().includes(query)
        );

        if (matches.length > 0) {
          dropdown.innerHTML = matches.map(m => `
            <div class="p-3 hover:bg-palace-gold/30 cursor-pointer border-b border-palace-gold/20 flex justify-between items-center transition" onclick="onSearchSelect('${m.id}')">
              <div>
                <p class="font-bold text-palace-brightgold text-sm">${m.name}</p>
                <p class="text-xs text-amber-100/70">${m.character} · ${m.region}</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-palace-gold"></i>
            </div>
          `).join('');
          dropdown.classList.remove('hidden');
        } else {
          dropdown.innerHTML = `<div class="p-3 text-xs text-amber-200/60 text-center">未找到相關宮殿</div>`;
          dropdown.classList.remove('hidden');
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        dropdown.classList.add('hidden');
        clearBtn.classList.add('hidden');
      });
    }

    function onSearchSelect(id) {
      const poi = POI_DATABASE.find(p => p.id === id);
      if (poi) {
        selectPOI(poi);
        document.getElementById('search-dropdown').classList.add('hidden');
      }
    }

    function openBookmarksModal() {
      const modal = document.getElementById('bookmarks-modal');
      const list = document.getElementById('bookmarks-list');

      if (state.saved.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-amber-200/60 py-8">尚無收藏景點，點擊景點面板中的❤️即可收藏！</p>`;
      } else {
        const savedPOIs = POI_DATABASE.filter(p => state.saved.includes(p.id));
        list.innerHTML = savedPOIs.map(p => `
          <div class="p-3 glass-panel rounded-xl border border-palace-gold/30 flex justify-between items-center hover:border-palace-gold transition">
            <div>
              <p class="font-bold text-palace-brightgold text-sm">${p.name}</p>
              <p class="text-xs text-amber-100/70">${p.character}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="selectPOIById('${p.id}')" class="px-3 py-1 rounded-lg bg-palace-gold/20 hover:bg-palace-gold/40 text-palace-brightgold text-xs border border-palace-gold/40">
                前往
              </button>
              <button onclick="removeBookmark('${p.id}')" class="text-rose-400 hover:text-rose-300 p-1">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>
        `).join('');
      }

      modal.classList.remove('hidden');
    }

    function selectPOIById(id) {
      const poi = POI_DATABASE.find(p => p.id === id);
      if (poi) {
        document.getElementById('bookmarks-modal').classList.add('hidden');
        selectPOI(poi);
      }
    }

    function removeBookmark(id) {
      const idx = state.saved.indexOf(id);
      if (idx > -1) {
        state.saved.splice(idx, 1);
        localStorage.setItem('zh_saved_spots', JSON.stringify(state.saved));
        openBookmarksModal();
        updateBookmarkBadge();
      }
    }

    /* =========================================================================
       14. TRIVIA QUIZ GAME
       ========================================================================= */
    function openQuizModal() {
      state.quizIndex = 0;
      state.quizScore = 0;
      document.getElementById('quiz-modal').classList.remove('hidden');
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const qData = QUIZ_DATABASE[state.quizIndex];
      document.getElementById('quiz-step-text').innerText = `問題 ${state.quizIndex + 1} / ${QUIZ_DATABASE.length}`;
      document.getElementById('quiz-score-text').innerText = `得分: ${state.quizScore}`;
      document.getElementById('quiz-question').innerText = qData.q;
      document.getElementById('quiz-feedback').classList.add('hidden');

      const optionsContainer = document.getElementById('quiz-options-container');
      optionsContainer.innerHTML = qData.options.map((opt, idx) => `
        <button onclick="submitQuizAnswer(${idx})" class="w-full text-left p-3 rounded-xl glass-panel hover:bg-palace-gold/30 border border-palace-gold/30 text-amber-100 text-xs font-bold transition flex items-center justify-between group">
          <span>${String.fromCharCode(65 + idx)}. ${opt}</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition text-palace-gold"></i>
        </button>
      `).join('');
    }

    function submitQuizAnswer(selectedIdx) {
      const qData = QUIZ_DATABASE[state.quizIndex];
      const feedback = document.getElementById('quiz-feedback');

      if (selectedIdx === qData.answer) {
        state.quizScore += 20;
        feedback.className = 'text-center font-bold text-xs p-3 rounded-xl bg-emerald-900/60 text-emerald-200 border border-emerald-500/40 my-2';
        feedback.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> 回答正確！${qData.explain}`;
      } else {
        feedback.className = 'text-center font-bold text-xs p-3 rounded-xl bg-rose-900/60 text-rose-200 border border-rose-500/40 my-2';
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> 回答錯誤！${qData.explain}`;
      }

      feedback.classList.remove('hidden');

      setTimeout(() => {
        state.quizIndex++;
        if (state.quizIndex < QUIZ_DATABASE.length) {
          renderQuizQuestion();
        } else {
          showQuizResults();
        }
      }, 2200);
    }

    function showQuizResults() {
      const container = document.getElementById('quiz-content');
      container.innerHTML = `
        <div class="text-center py-6">
          <i class="fa-solid fa-trophy text-5xl text-palace-brightgold mb-4 animate-bounce"></i>
          <h3 class="font-calli text-3xl text-palace-brightgold mb-2">測驗完成！</h3>
          <p class="text-lg text-amber-100 font-bold mb-4">得分: ${state.quizScore} / 100 分</p>
          <button onclick="openQuizModal()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-600 text-black font-bold text-sm shadow-xl hover:scale-105 transition">
            再試一次
          </button>
        </div>
      `;
    }

    /* =========================================================================
       15. WEB AUDIO API SYNTHESIZER
       ========================================================================= */
    let audioCtx;
    function toggleAudio() {
      state.audioEnabled = !state.audioEnabled;
      const icon = document.getElementById('icon-audio');

      if (state.audioEnabled) {
        icon.className = 'fa-solid fa-volume-high text-base text-palace-brightgold';
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playChimeSFX();
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-base';
      }
    }

    function playChimeSFX() {
      if (!state.audioEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.6);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    /* =========================================================================
       16. RESIZE & RENDER LOOP
       ========================================================================= */
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      controls.update();
      animateNPC(delta);
      animateParticles(delta);
      update3DMarkers();

      renderer.render(scene, camera);
    }

    /* =========================================================================
       17. INITIALIZATION ON LOAD
       ========================================================================= */
    window.onload = function() {
      init3D();
      updateProgressUI();
      updateBookmarkBadge();
      setupSearch();

      document.getElementById('btn-reset-cam').addEventListener('click', resetCamera);
      document.getElementById('close-panel').addEventListener('click', closeSidePanel);
      document.getElementById('btn-toggle-bookmark').addEventListener('click', toggleBookmarkCurrentPOI);
      document.getElementById('btn-enter-interior').addEventListener('click', enterInteriorView);
      document.getElementById('btn-exit-interior').addEventListener('click', exitInteriorView);
      document.getElementById('btn-interact-char').addEventListener('click', () => openCharacterDialogue(state.currentPOI));
      document.getElementById('panel-chat-trigger').addEventListener('click', () => openCharacterDialogue(state.currentPOI));

      document.getElementById('btn-daynight').addEventListener('click', () => setDayNightMode(!state.dayMode));
      document.getElementById('btn-quiz').addEventListener('click', openQuizModal);
      document.getElementById('close-quiz').addEventListener('click', () => document.getElementById('quiz-modal').classList.add('hidden'));

      document.getElementById('btn-bookmarks').addEventListener('click', openBookmarksModal);
      document.getElementById('close-bookmarks').addEventListener('click', () => document.getElementById('bookmarks-modal').classList.add('hidden'));

      document.getElementById('close-char-dialogue').addEventListener('click', () => document.getElementById('character-dialogue-modal').classList.add('hidden'));
      document.getElementById('btn-audio').addEventListener('click', toggleAudio);
    };
  </script>
</body>
